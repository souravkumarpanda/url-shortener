# Whole stack:   docker compose up --build
# Entry point:   http://localhost:8080   (the load balancer)
# Infra only:    docker compose up -d mongo redis kafka   (then npm start / npm run worker on the host)

x-api: &api
  build: .
  restart: unless-stopped
  environment: &api-env
    PORT: 8001
    MONGO_URL: mongodb://mongo:27017/short-url
    REDIS_URL: redis://redis:6379
    KAFKA_BROKERS: kafka:29092
    # Proxy hops in front of the app: 1 = nginx only; 2 = tunnel + nginx (see README)
    TRUST_PROXY: ${TRUST_PROXY:-1}
  depends_on:
    mongo: { condition: service_healthy }
    redis: { condition: service_healthy }
    kafka: { condition: service_started }
  healthcheck:
    test: ["CMD", "wget", "-qO-", "http://localhost:8001/readyz"]
    interval: 10s
    timeout: 3s
    retries: 5
    start_period: 10s

services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [api1, api2, api3]
    restart: unless-stopped

  api1:
    <<: *api
    environment: { <<: *api-env, INSTANCE_ID: api1 }
  api2:
    <<: *api
    environment: { <<: *api-env, INSTANCE_ID: api2 }
  api3:
    <<: *api
    environment: { <<: *api-env, INSTANCE_ID: api3 }

  # Optional public HTTPS URL (no account needed): docker compose --profile public up -d
  tunnel:
    image: cloudflare/cloudflared:latest
    profiles: ["public"]
    command: ["tunnel", "--no-autoupdate", "--url", "http://nginx:80"]
    depends_on: [nginx]
    restart: unless-stopped

  worker:
    build: .
    command: ["node", "worker.js"]
    restart: unless-stopped
    environment:
      MONGO_URL: mongodb://mongo:27017/short-url
      KAFKA_BROKERS: kafka:29092
    depends_on:
      mongo: { condition: service_healthy }
      kafka: { condition: service_started }

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Single-node Kafka in KRaft mode. Two listeners: kafka:29092 for containers,
  # localhost:9092 for apps running on your host machine.
  kafka:
    image: apache/kafka:3.8.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:9093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

volumes:
  mongo-data:
