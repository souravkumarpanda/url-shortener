# If a tunnel/CDN in front already says "https", keep it; otherwise use what nginx saw.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

upstream api_servers {
    least_conn;                                   # send each request to the least busy instance
    server api1:8001 max_fails=3 fail_timeout=10s;
    server api2:8001 max_fails=3 fail_timeout=10s;
    server api3:8001 max_fails=3 fail_timeout=10s;
    keepalive 32;                                 # reuse connections to the instances
}

server {
    listen 80;

    location / {
        proxy_pass http://api_servers;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # The app reads the real client IP from X-Forwarded-For (TRUST_PROXY=1).
        # $proxy_add_x_forwarded_for appends the address nginx saw, so a client
        # cannot spoof its own IP by sending the header.
        proxy_set_header Host              $http_host;   # keeps the port (e.g. :8080) so generated links work
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;

        # If an instance is down or errors, try the next one. nginx never retries
        # POST requests this way, so creating a URL can't be applied twice.
        proxy_next_upstream error timeout http_502 http_503;
        proxy_next_upstream_tries 2;
        proxy_connect_timeout 2s;
        proxy_read_timeout 15s;

        add_header X-Upstream $upstream_addr always;
    }
}
